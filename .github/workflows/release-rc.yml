name: Publish RC

# Publish-only path for Changesets prerelease versions. Humans run
# `changeset pre enter rc` + `bun run version` (and land that commit / PR)
# first; this workflow never bumps versions or enters pre mode.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish-rc" to confirm publishing prereleases with dist-tag rc'
        required: true
        type: string
      ref:
        description: "Git ref that already contains RC version bumps (branch, tag, or SHA)"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ inputs.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  publish-rc:
    name: Publish RC
    if: inputs.confirm == 'publish-rc'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      # npm 11.5.1 or later must be installed for OIDC trusted publishing.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Require prerelease versions
        run: bun run scripts/require-prerelease-versions.ts

      - name: Build publishable packages
        run: bun run build:publish

      - name: Typecheck publishable packages
        run: bun run typecheck:publish

      - name: Publish with dist-tag rc
        run: bun run ci:publish
        env:
          NPM_DIST_TAG: rc
