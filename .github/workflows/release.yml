name: Release

on:
  push:
    branches:
      - main
  # Allows maintainers to manually rerun release publishing without
  # manufacturing a new commit or reverting a version PR.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    # Only publish from main even if workflow_dispatch is run from another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      # npm 11.5.1 or later must be installed for OIDC trusted publishing.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Publishables: @agent-dev-lab/core, @agent-dev-lab/cli, @agent-dev-lab/web.
      # docs and playground stay private (changeset ignore + no publish).
      # CLI prebuild requires apps/web/.output, so web is in the build graph.
      - name: Build publishable packages
        run: bun run build:publish

      - name: Typecheck publishable packages
        run: bun run typecheck:publish

      - name: Lint
        run: bun run lint

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: bun run version
          # A single script so changesets/action does not split turbo filters.
          publish: bun run ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
